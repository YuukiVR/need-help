# Cloudflare Worker serving the Vite SPA as static assets.
# Build command: `npm run build` (outputs to dist/, then inlines assets)
# Deploy command: `npx wrangler deploy`
name = "need-help"
compatibility_date = "2026-11-15"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"